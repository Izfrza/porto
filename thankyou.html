<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih! - Iza Faroza</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .thankyou-container {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 40px;
            padding: 60px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease;
        }

        .thankyou-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #6C63FF, #FF6584);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(255, 101, 132, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            border: 3px solid rgba(108, 99, 255, 0.5);
            animation: pulse 2s infinite;
        }

        .success-icon i {
            font-size: 50px;
            color: #6C63FF;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 800;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.8;
            text-align: center;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        .email-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 35px;
            border: 1px solid rgba(108, 99, 255, 0.2);
        }

        .email-info p {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .email-info i {
            color: #6C63FF;
            font-size: 1.3rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(108, 99, 255, 0.3);
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .btn-back:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(108, 99, 255, 0.4);
        }

        .btn-back i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .btn-back:hover i {
            transform: translateX(-5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(108, 99, 255, 0.5);
            }
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .thankyou-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .message {
                font-size: 1.1rem;
            }
        }

        @media screen and (max-width: 576px) {
            .thankyou-container {
                padding: 30px 20px;
                border-radius: 30px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .success-icon {
                width: 80px;
                height: 80px;
            }

            .success-icon i {
                font-size: 40px;
            }

            .message {
                font-size: 1rem;
            }

            .email-info {
                padding: 20px;
            }

            .email-info p {
                font-size: 0.9rem;
            }

            .btn-back {
                padding: 14px 30px;
                font-size: 1rem;
            }
        }

        @media screen and (max-width: 380px) {
            .thankyou-container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .btn-back {
                padding: 12px 25px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="thankyou-container">
        <div class="success-icon">
            <i class='bx bx-check-circle'></i>
        </div>
        
        <h1>Terima Kasih! 🙏</h1>
        
        <p class="message">
            Pesan Anda telah berhasil terkirim. Saya sangat menghargai waktu dan kepercayaan Anda untuk menghubungi saya.
        </p>
        
        <div class="email-info">
            <p>
                <i class='bx bx-time'></i>
                <strong>Respon dalam 1x24 jam</strong>
            </p>
            <p>
                <i class='bx bx-envelope'></i>
                Cek email Anda untuk konfirmasi otomatis
            </p>
            <p>
                <i class='bx bx-check-shield'></i>
                Pesan Anda aman & terenkripsi
            </p>
        </div>
        
        <a href="/" class="btn-back">
            <i class='bx bx-arrow-back'></i>
            Kembali ke Portfolio
        </a>
    </div>
</body>
</html>
